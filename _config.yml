title: LDWXNL 的主页
description: 我的个人网站和博客
baseurl: ""
url: "https://ldwxnl.github.io"
theme: jekyll-theme-cayman

# 自定义颜色（可选）
color:
  primary: "#2a7ae2"   # 主色调（按钮、链接）
  secondary: "#6c757d" # 次要颜色
  background: "#ffffff" # 背景色
  text: "#333333"      # 文字颜色
  link: "#007bff"      # 链接颜色
  
include: ["_pages"]  # ✅ 关键：包含 _pages 文件夹
exclude: []           # 确保这里是空数组

/* 更通透的玻璃效果 */
.card {
  background: rgba(255, 255, 255, 0.08); /* 透明度提高 */
  backdrop-filter: blur(20px); /* 模糊度加大 */
  border: 1px solid rgba(255, 255, 255, 0.15); /* 边框更明显 */
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); /* 阴影更柔和 */
}
